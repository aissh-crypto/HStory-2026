name: Automatic Firebase Deploy
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Push Assets Live
        run: npx firebase-tools deploy --only hosting --project divine-transport-nnm9t --token "${{ secrets.FIREBASE_TOKEN }}"
